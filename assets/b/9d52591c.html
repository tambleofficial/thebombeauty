<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#850D20"></rect><text x="50" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#F5F1ED">BOM</text></svg></template>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="./image-slot.js"></script>
<style>
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:#080708;color:#F5F1ED;font-family:"Pretendard Variable",Pretendard,"Helvetica Neue",Inter,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
*{box-sizing:border-box}
::selection{background:#A51229;color:#FFFFFF}
</style>
</helmet>
<dc-import name="Header v4" active="CASES" hint-size="100%,0px"></dc-import>
<dc-import name="DetailRibbon v7" variant="A" en="CASES" ko="실제 작업으로|보여드립니다." desc="고객 동의를 받은 실제 작업물과 후기만 게시합니다. Before · After는 동일 고객·동일 부위 자료만 사용합니다." hint-size="100%,70svh"></dc-import>
<section data-screen-label="Cases Intro" style="background:#FFFFFF;color:#080708;padding:48px clamp(20px,5vw,72px) clamp(96px,11vw,160px)">
  <div style="max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:40px">
        <div style="position:sticky;top:80px;z-index:20;background:rgba(255,255,255,0.96);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 28px;border-bottom:1px solid #E6E0DC">
      <div style="display:flex;flex-wrap:wrap;gap:4px 28px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
          <button onClick="{{ f.select }}" style="background:none;border:none;padding:16px 0;min-height:52px;margin-bottom:-1px;font:inherit;font-size:15px;font-weight:600;letter-spacing:0.06em;color:{{ f.color }};border-bottom:2px solid {{ f.line }};cursor:pointer;transition:color .3s ease,border-color .3s ease">{{ f.label }}</button>
        </sc-for>
      </div>
      <span style="font-size:14px;color:#7A7173">{{ countLabel }}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat({{ cols }},minmax(0,1fr));gap:clamp(12px,1.6vw,24px);row-gap:36px">
      <sc-for list="{{ cases }}" as="c" hint-placeholder-count="9">
        <div onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" style="display:flex;flex-direction:column;gap:14px;opacity:{{ c.op }};transform:translateY({{ c.y }});transition:opacity .7s cubic-bezier(.16,1,.3,1) {{ c.dl }},transform .9s cubic-bezier(.16,1,.3,1) {{ c.dl }}">
          <div style="position:relative;aspect-ratio:4/5;overflow:hidden;background:#F0EBE7">
            <div style="position:absolute;inset:0;transform:scale({{ c.sc }});transition:transform .9s cubic-bezier(.16,1,.3,1)"><image-slot id="{{ c.slot }}" src="{{ c.src }}" shape="rect" placeholder="{{ c.ph }}"></image-slot></div>
            <button onClick="{{ c.open }}" style="position:absolute;right:14px;bottom:14px;min-height:44px;padding:0 18px;background:#080708;color:#FFFFFF;border:none;font:inherit;font-size:13px;font-weight:600;letter-spacing:0.08em;cursor:pointer;opacity:{{ c.btnOp }};transform:translateY({{ c.btnY }});transition:opacity .4s ease,transform .4s ease">VIEW</button>
          </div>
          <span style="font-size:16px;font-weight:600">{{ c.ko }} <span style="font-weight:400;color:#7A7173;margin-left:6px">{{ c.num }}</span></span>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;justify-content:center"><button onClick="{{ more }}" style="min-height:56px;padding:0 40px;background:#080708;color:#FFFFFF;border:none;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .3s ease" style-hover="background:#850D20">{{ moreLabel }}</button></div>
    </sc-if>
  </div>
</section>
<section data-screen-label="Before After" style="background:#080708;color:#F5F1ED;padding:clamp(96px,11vw,160px) clamp(20px,5vw,72px)">
  <div style="max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:48px">
    <div style="display:flex;flex-direction:column;gap:20px;max-width:820px">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.28em;color:#B51C31">BEFORE · AFTER</span>
      <h2 style="margin:0;font-size:clamp(32px,4.2vw,60px);font-weight:600;line-height:1.24;letter-spacing:-0.035em">같은 조건에서 비교합니다</h2>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(20px,2.4vw,32px)">
      <dc-import name="BeforeAfter" slot-prefix="v4-cases-ba-1" tag="눈썹" caption="사례 정보 입력" hint-size="100%,520px"></dc-import>
      <dc-import name="BeforeAfter" slot-prefix="v4-cases-ba-2" tag="입술" caption="사례 정보 입력" hint-size="100%,520px"></dc-import>
      <dc-import name="BeforeAfter" slot-prefix="v4-cases-ba-3" tag="수정·복원" caption="사례 정보 입력" hint-size="100%,520px"></dc-import>
    </div>
  </div>
</section>
<section id="review" data-screen-label="Reviews" style="background:#171214;padding:clamp(96px,11vw,168px) clamp(20px,5vw,72px)">
  <div style="max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:48px">
    <div style="display:flex;flex-direction:column;gap:20px;max-width:820px">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.28em;color:#B51C31">CUSTOMER REVIEW</span>
      <h2 style="margin:0;font-size:clamp(34px,4.6vw,68px);font-weight:600;line-height:1.22;letter-spacing:-0.035em">고객 후기</h2>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(16px,2vw,28px)">
      <sc-for list="{{ reviews }}" as="r" hint-placeholder-count="3">
        <article data-fx-kind="reveal" data-fx-delay="{{ r.d }}" style="display:flex;flex-direction:column;gap:16px">
          <div style="position:relative;aspect-ratio:4/5;overflow:hidden;background:#080708"><img src="{{ r.img }}" alt="{{ r.cat }} 후기" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ r.pos }};display:block"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#A8A1A2"><span style="color:#FFFFFF;font-weight:600">{{ r.cat }}</span><span>{{ r.date }}</span></div>
          <p style="margin:0;font-size:16px;line-height:1.75;color:#E8E2DE">{{ r.text }}</p>
          <span style="font-size:13px;color:#A8A1A2">{{ r.who }}</span>
        </article>
      </sc-for>
    </div>
    <a href="https://naver.me/xq3aRFIe" target="_blank" rel="noopener" style="align-self:flex-start;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 24px;background:#03C75A;color:#FFFFFF;font-size:15px;font-weight:700;transition:transform .3s ease" style-hover="transform:translateY(-2px)"><dc-import name="SnsIcon" icon="naver" size="16" hint-size="16px,16px"></dc-import>네이버 플레이스 후기</a>
  </div>
</section>
<dc-import name="Footer v4" hint-size="100%,320px"></dc-import>

<sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" onClick="{{ closeLb }}" style="position:fixed;inset:0;z-index:60;background:rgba(8,7,8,0.95);display:flex;align-items:center;justify-content:center;padding:24px">
    <div onClick="{{ stop }}" style="display:flex;flex-wrap:wrap;gap:40px;align-items:end;max-width:1040px;width:100%">
      <div style="position:relative;aspect-ratio:4/5;height:min(78vh,760px);max-width:100%"><image-slot id="{{ lb.slot }}" src="{{ lb.src }}" shape="rect" placeholder="{{ lb.ph }}"></image-slot></div>
      <div style="display:flex;flex-direction:column;gap:16px;flex:1;min-width:220px">
        <span style="font-size:12px;font-weight:600;letter-spacing:0.24em;color:#B51C31">{{ lb.en }}</span>
        <span style="font-size:30px;font-weight:600">{{ lb.ko }} {{ lb.num }}</span>
        <span style="font-size:16px;line-height:1.8;color:#E8E2DE">시술 부위 · 진행 횟수 · 상담 포인트 — 실제 사례 정보 입력</span>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button onClick="{{ prev }}" aria-label="이전" style="width:52px;height:52px;background:none;border:1px solid #F5F1ED;color:#F5F1ED;font:inherit;font-size:18px;cursor:pointer">←</button>
          <button onClick="{{ next }}" aria-label="다음" style="width:52px;height:52px;background:none;border:1px solid #F5F1ED;color:#F5F1ED;font:inherit;font-size:18px;cursor:pointer">→</button>
          <button onClick="{{ closeLb }}" style="min-height:52px;padding:0 26px;background:#F5F1ED;border:none;color:#080708;font:inherit;font-size:15px;font-weight:700;cursor:pointer">닫기</button>
        </div>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PHOTO={"BROW":["assets/cases/brow/rep1.jpg","assets/cases/brow/rep0.jpg","assets/cases/brow/rep2.jpg","assets/cases/brow/11.jpg","assets/cases/brow/KakaoTalk_20261005_003316473_03.png","assets/cases/brow/KakaoTalk_20261005_003316473_11.jpg","assets/cases/brow/KakaoTalk_20261005_003316473_18.jpg","assets/cases/brow/KakaoTalk_20261005_003321434_11.png","assets/cases/brow/KakaoTalk_20261005_004527127_02.jpg"],"LIP":["assets/cases/lip/KakaoTalk_20261005_004518454_09.jpg","assets/cases/lip/KakaoTalk_20261005_004518454_10.png","assets/cases/lip/KakaoTalk_20261005_004518454_17.jpg","assets/cases/lip/KakaoTalk_20261005_004518454_24.jpg","assets/cases/lip/KakaoTalk_20261005_004518454_27.png","assets/cases/lip/KakaoTalk_20261005_004523216_08.png","assets/cases/lip/KakaoTalk_20261005_004523216_23.jpg","assets/cases/lip/KakaoTalk_20261005_004527127_04.jpg","assets/cases/lip/KakaoTalk_20261005_004527127_06.jpg"],"EYELINE":["assets/raw/eye01.jpg","assets/raw/cor02.jpg","assets/cases/brow/KakaoTalk_20261005_003321434_06.jpg","assets/cases/brow/KakaoTalk_20261005_003321434_08.jpg","assets/cases/brow/KakaoTalk_20261005_003321434_09.jpg"],"SCALP":["assets/raw/prog-scalp.jpg","assets/raw/scalp01.jpg","assets/raw/scalp02.jpg","assets/raw/scalp03.jpg","assets/raw/scalp04.jpg","assets/cases/brow/KakaoTalk_20261005_003321434_12.jpg","assets/cases/brow/KakaoTalk_20261005_003321434_14.jpg","assets/cases/brow/KakaoTalk_20261005_003321434_17.jpg","assets/cases/lip/KakaoTalk_20261005_004518454_14.jpg"],"CORRECTION":["assets/cases/cor/1.jpg","assets/cases/cor/5.jpg","assets/cases/cor/7.jpg","assets/raw/cor01.jpg","assets/raw/cor03.jpg"]};
const ORDER=(()=>{const k=['BROW','LIP','CORRECTION','BROW','LIP','EYELINE','BROW','SCALP','LIP'],used={},out=[];let left=Object.values(PHOTO).reduce((a,b)=>a+b.length,0);while(left>0){for(const c of k){const n=used[c]||0;if(n<PHOTO[c].length){out.push([c,PHOTO[c][n]]);used[c]=n+1;left--;}}}return out;})();
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440, filter: 'ALL', limit: 24, lb: -1, hov: -1, shown: false };
  componentDidMount() {
    const h = (window.location.hash || '').slice(1).toUpperCase();
    if (['BROW', 'LIP', 'EYELINE', 'SCALP', 'CORRECTION'].includes(h)) this.setState({ filter: h });
    this.onResize = () => { const w = window.innerWidth; if (w !== this.state.w) this.setState({ w }); };
    this.onKey = e => { if (this.state.lb < 0) return; if (e.key === 'Escape') this.setState({ lb: -1 }); if (e.key === 'ArrowRight') this.step(1); if (e.key === 'ArrowLeft') this.step(-1); };
    window.addEventListener('resize', this.onResize); window.addEventListener('keydown', this.onKey);
    this.t = setTimeout(() => this.setState({ shown: true }), 250);
  }
  componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.t2); window.removeEventListener('resize', this.onResize); window.removeEventListener('keydown', this.onKey); }
  list() {
    const ko = { BROW: '눈썹', LIP: '입술', EYELINE: '아이라인', SCALP: '두피', CORRECTION: '수정·복원' };
    const n = {};
    return ORDER.map(([c, src], i) => { n[c] = (n[c] || 0) + 1; return { id: i, en: c, ko: ko[c], num: String(n[c]).padStart(2, '0'), slot: 'v4-case-' + c.toLowerCase() + '-' + n[c], src, ph: ko[c] + ' — 실제 작업 사진 4:5' }; })
      .filter(c => this.state.filter === 'ALL' || c.en === this.state.filter);
  }
  step(d) { const L = Math.min(9, this.list().length); this.setState(s => ({ lb: (s.lb + d + L) % L })); }
  renderVals() {
    const { w, filter, lb, hov, shown, limit } = this.state;
    const list = this.list();
    const vis = list.slice(0, 9);
    const touch = w < 900;
    return {
      filters: [['ALL', '전체'], ['BROW', '눈썹'], ['LIP', '입술'], ['EYELINE', '아이라인'], ['SCALP', '두피'], ['CORRECTION', '수정·복원']].map(([k, l]) => { const on = k === filter; return { label: l, select: () => { this.setState({ filter: k, shown: false, limit: 24 }); clearTimeout(this.t2); this.t2 = setTimeout(() => this.setState({ shown: true }), 60); history.replaceState(null, '', k === 'ALL' ? location.pathname : '#' + k); }, color: on ? '#080708' : '#7A7173', line: on ? '#850D20' : 'transparent' }; }),
      cases: vis.map((c, i) => { const h = hov === c.id || touch; return { ...c, open: () => this.setState({ lb: i }), enter: () => this.setState({ hov: c.id }), leave: () => this.setState({ hov: -1 }), sc: hov === c.id ? 1.02 : 1, btnOp: h ? 1 : 0, btnY: h ? '0' : '8px', op: shown ? 1 : 0, y: shown ? '0' : '28px', dl: (Math.min(i % 24, 8) * 0.06) + 's' }; }),
      hasMore: false, moreLabel: '더 보기 (' + Math.min(limit, list.length) + ' / ' + list.length + ')', more: () => this.setState(s => ({ limit: s.limit + 24 })),
      countLabel: '총 ' + vis.length + '건', cols: w < 560 ? 1 : w < 980 ? 2 : 3,
      reviews: [
        { img: (typeof document !== 'undefined' && document.getElementById('pre-review-lip') && document.getElementById('pre-review-lip').getAttribute('src')) || 'assets/review-lip.jpg', pos: '30% 40%', cat: '눈썹', date: '2026.09.12', who: '김○○ 고객님', text: '얼굴형부터 꼼꼼하게 봐주시고 디자인을 여러 번 맞춰주셨어요. 화장 안 해도 인상이 또렷해 보여서 아침 준비 시간이 확 줄었습니다.' },
        { img: (typeof document !== 'undefined' && document.getElementById('pre-review-correction') && document.getElementById('pre-review-correction').getAttribute('src')) || 'assets/review-correction.jpg', pos: '50% 8%', cat: '입술', date: '2026.08.27', who: '이○○ 고객님', text: '입술 색이 칙칙해서 고민이었는데 피부톤에 맞는 컬러로 상담받았어요. 립 안 발라도 생기 있어 보인다는 말을 자주 들어요.' },
        { img: (typeof document !== 'undefined' && document.getElementById('pre-review-brow') && document.getElementById('pre-review-brow').getAttribute('src')) || 'assets/review-brow.jpg', pos: '50% 50%', cat: '리커렉션', date: '2026.07.18', who: '박○○ 고객님', text: '예전 반영구 잔흔 때문에 걱정이 많았는데 현재 상태를 솔직하게 설명해주시고 가능한 방향을 차근차근 잡아주셨어요.' },
      ].map((r, i) => ({ ...r, d: i * 100 })),
      lightboxOpen: lb >= 0 && !!vis[lb], lb: vis[lb] || {},
      closeLb: () => this.setState({ lb: -1 }), stop: e => e.stopPropagation(), prev: () => this.step(-1), next: () => this.step(1),
    };
  }
}
</script>
</body>
</html>
