<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes s5FloatA{0%,100%{transform:translate(-50%,-50%) translate3d(0,0,0)}50%{transform:translate(-50%,-50%) translate3d(0,-44px,0)}}
@keyframes s5FloatB{0%,100%{transform:translate(-50%,-50%) translate3d(0,0,0)}50%{transform:translate(-50%,-50%) translate3d(26px,30px,0)}}
@keyframes s5Pulse{0%,100%{opacity:.6}50%{opacity:.95}}
@keyframes s5Breath{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes s5Spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes s5DriftA{0%,100%{transform:translate(-50%,-50%) translate3d(0,0,0)}33%{transform:translate(-50%,-50%) translate3d(90px,-70px,0)}66%{transform:translate(-50%,-50%) translate3d(-60px,56px,0)}}
@keyframes s5DriftB{0%,100%{transform:translate(-50%,-50%) translate3d(0,0,0)}50%{transform:translate(-50%,-50%) translate3d(-80px,64px,0)}}
@keyframes s5SweepLoop{0%{transform:translateX(-140%) skewX(-14deg)}38%,100%{transform:translateX(460%) skewX(-14deg)}}
@keyframes s5Rays{from{background-position:0 0}to{background-position:240px 0}}
@keyframes s5Shine{0%{background-position:130% 0}45%,100%{background-position:-30% 0}}
@keyframes s5Twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0deg)}45%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:0;transform:scale(.6) rotate(90deg)}}
@keyframes s5Cue{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}
</style>
</helmet>
<section ref="{{ rootRef }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" data-screen-label="Page Hero" style="--logoMask:url({{ logoSrc }});position:relative;height:{{ h }};min-height:680px;overflow:hidden;background:#080708;color:#FFFFFF;font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Helvetica Neue',sans-serif">
  <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(ellipse 90% 80% at 50% 48%,#3A0610 0%,#140307 58%,#080708 100%)"></div>

  <div aria-hidden="true" style="position:absolute;inset:0;transform:translate3d(calc(var(--mx,0) * 26px),calc(var(--my,0) * 18px),0);transition:transform 1.8s cubic-bezier(.16,1,.3,1)">
    <sc-for list="{{ orbs }}" as="o" hint-placeholder-count="4">
      <div data-s5="1" style="position:absolute;left:{{ o.x }};top:{{ o.y }};width:{{ o.d }};aspect-ratio:1;border-radius:50%;background:{{ o.bg }};box-shadow:{{ o.sh }};opacity:{{ o.op }};transform:translate(-50%,-50%);will-change:transform;animation:{{ o.anim }};transition:opacity 1.6s ease {{ o.dl }};overflow:hidden"><div data-s5="1" style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 24%,rgba(255,236,238,0.75) 0%,rgba(255,236,238,0.18) 12%,rgba(255,236,238,0) 26%);opacity:{{ glintOp }};animation:{{ glintAnim }}"></div></div>
    </sc-for>
  </div>

  <div aria-hidden="true" style="position:absolute;left:50%;top:-8%;width:110%;height:118%;transform:translateX(calc(-50% + var(--mx,0) * 26px)) rotate(calc(var(--mx,0) * 2deg));transform-origin:50% 0;transition:transform 2s cubic-bezier(.16,1,.3,1),opacity 1.6s ease;clip-path:polygon(43% 0,57% 0,88% 100%,12% 100%);background:linear-gradient(180deg,rgba(225,60,80,0.5) 0%,rgba(165,18,41,0.26) 46%,rgba(133,13,32,0) 92%);filter:blur(26px);opacity:{{ beamOp }};pointer-events:none;will-change:opacity;contain:paint"><div data-s5="1" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,120,136,0.35) 0%,rgba(255,120,136,0) 70%);opacity:0;animation:{{ beamAnim }}"></div></div>
  <sc-if value="{{ fxRays }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" data-s5="1" style="position:absolute;left:50%;top:-8%;width:110%;height:118%;transform:translateX(calc(-50% + var(--mx,0) * 26px));clip-path:polygon(43% 0,57% 0,88% 100%,12% 100%);background:repeating-linear-gradient(100deg,rgba(255,200,206,0) 0px,rgba(255,200,206,0) 26px,rgba(255,200,206,0.12) 34px,rgba(255,200,206,0) 44px);-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,0) 85%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,0) 85%);filter:blur(3px);opacity:{{ beamOp }};animation:s5Rays 9s linear infinite;pointer-events:none;transition:opacity 1.6s ease"></div></sc-if>
  <sc-if value="{{ fxTwinkle }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none"><sc-for list="{{ twinkles }}" as="t" hint-placeholder-count="5"><span data-s5="1" style="position:absolute;left:{{ t.x }};top:{{ t.y }};width:{{ t.s }};height:{{ t.s }};margin:{{ t.m }};background:radial-gradient(circle,rgba(255,240,242,1) 0%,rgba(255,240,242,0) 60%);-webkit-mask:linear-gradient(#000,#000) center/14% 100% no-repeat,linear-gradient(#000,#000) center/100% 14% no-repeat;mask:linear-gradient(#000,#000) center/14% 100% no-repeat,linear-gradient(#000,#000) center/100% 14% no-repeat;opacity:0;animation:s5Twinkle {{ t.dur }} ease-in-out {{ t.dl }} infinite"></span></sc-for></div></sc-if>
  <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(ellipse 46% 56% at 50% 46%,rgba(8,7,8,0.42) 0%,rgba(8,7,8,0.14) 55%,rgba(8,7,8,0) 80%);pointer-events:none"></div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:#080708;opacity:{{ veil }};transition:opacity 1.6s cubic-bezier(.4,0,.2,1);pointer-events:none"></div>
