<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ rootRef }}" aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;pointer-events:none;background:{{ base }};opacity:{{ op }};transition:{{ opTr }}">
  <div style="position:absolute;inset:-20%;transform:scale({{ lightS }});opacity:{{ lightOp }};transition:{{ lightTr }}">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse 55% 60% at {{ lx }} {{ ly }}, {{ c1 }} 0%, {{ c2 }} 38%, rgba(133,13,32,0) 72%);transform:translate3d(calc(var(--lx,0) * 34px),calc(var(--ly,0) * 26px),0);transition:transform 2.2s cubic-bezier(.2,.7,.2,1)"></div>
  </div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,8,0) 50%,rgba(8,7,8,{{ vig }}) 100%)"></div>
  <div style="position:absolute;top:-10%;bottom:-10%;left:0;width:36%;background:linear-gradient(100deg,rgba(255,240,240,0) 0%,rgba(255,240,240,0.13) 50%,rgba(255,240,240,0) 100%);transform:translateX({{ sweepX }}) skewX(-14deg);transition:{{ sweepTr }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 800, &quot;height&quot;: 500}, &quot;tone&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;crimson&quot;, &quot;black&quot;], &quot;default&quot;: &quot;crimson&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;sweep&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;delay&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 0, &quot;tsType&quot;: &quot;number&quot;}, &quot;x&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;26%&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;y&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;24%&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { s: -1 };
  rootRef = React.createRef();
  componentDidMount() {
    this.reduced = false;
    const d = Number(this.props.delay ?? 0);
    if (this.reduced) { this.setState({ s: 3 }); return; }
    this.t = [d + 60, d + 900, d + 1300].map((ms, i) => setTimeout(() => this.setState({ s: i }), ms));
    this.onMove = e => {
      const el = this.rootRef.current; if (!el) return;
      el.style.setProperty('--lx', (e.clientX / window.innerWidth * 2 - 1).toFixed(3));
      el.style.setProperty('--ly', (e.clientY / window.innerHeight * 2 - 1).toFixed(3));
    };
    if (!(window.matchMedia && window.matchMedia('(hover: none)').matches)) window.addEventListener('mousemove', this.onMove, { passive: true });
  }
  componentWillUnmount() { (this.t || []).forEach(clearTimeout); window.removeEventListener('mousemove', this.onMove); }
  renderVals() {
    const { s } = this.state;
    const r = this.reduced, black = (this.props.tone ?? 'crimson') === 'black';
    const sweep = this.props.sweep ?? true;
    return {
      rootRef: this.rootRef,
      base: black ? '#080708' : '#850D20',
      c1: black ? 'rgba(165,18,41,0.55)' : 'rgba(181,28,49,0.95)', c2: black ? 'rgba(133,13,32,0.25)' : 'rgba(165,18,41,0.5)',
      vig: black ? '0.2' : '0.5',
      lx: this.props.x ?? '26%', ly: this.props.y ?? '24%',
      op: s >= 0 ? 1 : 0, opTr: r ? 'none' : 'opacity 1.1s ease',
      lightS: s >= 1 ? 1 : 1.3, lightOp: s >= 1 ? 1 : 0.35, lightTr: r ? 'none' : 'transform 2.4s cubic-bezier(.2,.7,.2,1), opacity 2s ease',
      sweepX: sweep && s >= 2 ? '330%' : '-130%', sweepTr: r || !sweep ? 'none' : 'transform 1.9s cubic-bezier(.6,0,.2,1)',
    };
  }
}
</script>
</body>
</html>
