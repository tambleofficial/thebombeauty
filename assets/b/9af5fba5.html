<style>
@keyframes r7a{0%,100%{transform:translate(-50%,-50%) rotate(-10deg) scaleX(1)}50%{transform:translate(-46%,-56%) rotate(-4deg) scaleX(1.08)}}
@keyframes r7b{0%,100%{transform:translate(-50%,-50%) rotate(8deg)}50%{transform:translate(-55%,-45%) rotate(14deg)}}
@keyframes r7c{0%,100%{transform:translate(-50%,-50%) rotate(-32deg) scaleX(1)}50%{transform:translate(-47%,-54%) rotate(-25deg) scaleX(1.06)}}
@keyframes r7d{0%,100%{transform:translate(-50%,-50%) rotate(28deg)}50%{transform:translate(-54%,-46%) rotate(20deg)}}
@keyframes r7v{0%,100%{transform:translate(-50%,-50%) rotate(80deg) scaleX(1)}50%{transform:translate(-50%,-50%) rotate(86deg) scaleX(1.08)}}
@keyframes r7v2{0%,100%{transform:translate(-50%,-50%) rotate(96deg)}50%{transform:translate(-50%,-50%) rotate(90deg)}}
@keyframes r7glow{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes r7shine{0%{transform:translateX(-160%) skewX(-16deg)}45%,100%{transform:translateX(460%) skewX(-16deg)}}
</style>
</helmet>

  state = { s: 3, w: typeof window !== 'undefined' ? window.innerWidth : 1440 };
