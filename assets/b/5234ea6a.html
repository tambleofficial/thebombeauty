<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;&quot;, &quot;BRAND&quot;, &quot;PROGRAM&quot;, &quot;CORRECTION&quot;, &quot;CASES&quot;, &quot;CONTACT&quot;], &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440, vh: typeof window !== 'undefined' ? window.innerHeight : 900, scrolled: false, quick: false, menu: false };
  componentDidMount() {
    this.reduced = false;
    this.onResize = () => { const w = window.innerWidth, vh = window.innerHeight; if (w !== this.state.w || Math.abs(vh - this.state.vh) > 80) this.setState({ w, vh }); };
    this.onScroll = () => {
      if (this.raf) return;
      this.raf = requestAnimationFrame(() => {
        this.raf = null;
        const y = window.scrollY;
        const scrolled = y > 40, quick = y > window.innerHeight * 0.8;
        if (scrolled !== this.state.scrolled || quick !== this.state.quick) this.setState({ scrolled, quick });
        this.parallax();
      });
    };
    this.onKey = e => { if (e.key === 'Escape') this.setState({ menu: false }); };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('keydown', this.onKey);
    this.onLinkClick = e => {
      if (/\.dc\.html$/i.test(decodeURIComponent(location.pathname))) return;
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const m = decodeURIComponent(a.getAttribute('href') || '').match(/^(Home|Brand|Program|Correction|Cases|Contact) v4\.dc\.html(#.*)?$/);
      if (!m) return;
      e.preventDefault();
      location.href = { Home: 'index', Brand: 'brand', Program: 'program', Correction: 'correction', Cases: 'cases', Contact: 'contact' }[m[1]] + '.html' + (m[2] || '');
    };
    document.addEventListener('click', this.onLinkClick, true);
    if (!this.reduced && 'IntersectionObserver' in window) this.fx();
    this.parallax();
  }
  fx() {
    const E = 'cubic-bezier(.16,1,.3,1)', M = 'cubic-bezier(.76,0,.24,1)';
    const show = el => {
      const k = el.getAttribute('data-fx');
      el.style.opacity = '1';
      el.style.transform = 'none';
      el.style.clipPath = 'inset(0 0 0 0)';
      el.style.filter = 'none';
      if (k === 'img' && el.firstElementChild) el.firstElementChild.style.transform = 'scale(1)';
    };
    this.io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { show(en.target); this.io.unobserve(en.target); } }), { rootMargin: '0px 0px -10% 0px', threshold: 0.08 });
    const inHero = el => !!el.closest('[data-screen-label*="Hero"]');
    const prep = (el, kind, delay) => {
      if (el.hasAttribute('data-fx') || inHero(el)) return;
      const mob = window.innerWidth < 900;
      const noBlur = mob;
      el.setAttribute('data-fx', kind);
      const d = delay + 'ms';
      if (mob) {
        // Phones repaint clip-path / blur / image-rescale reveals on the main
        // thread, which stalls the scroll at every section boundary.
        if (kind === 'line') {
          el.style.transformOrigin = '0 50%'; el.style.transform = 'scaleX(0)';
          el.style.transition = `transform .7s ${M} ${d}`;
        } else if (kind === 'img') {
          el.style.opacity = '0';
          el.style.transition = `opacity .5s ease ${d}`;
        } else {
          el.style.opacity = '0'; el.style.transform = 'translate3d(0,20px,0)';
          el.style.transition = `opacity .5s ease ${d}, transform .6s ${E} ${d}`;
        }
        this.io.observe(el);
        (this.fxPending || (this.fxPending = [])).push(el);
        return;
      }
      if (kind === 'title') {
        el.style.clipPath = 'inset(0 0 100% 0)'; el.style.transform = 'translateY(56px)'; el.style.opacity = '0';
        el.style.transition = `clip-path 1.3s ${M} ${d}, transform 1.3s ${E} ${d}, opacity .6s ease ${d}`;
      } else if (kind === 'img') {
        el.style.clipPath = 'inset(100% 0 0 0)';
        el.style.transition = `clip-path 1.5s ${M} ${d}`;
        const c = el.firstElementChild;
        if (c) { c.style.transform = 'scale(1.3)'; c.style.transition = `transform 2.2s ${E} ${d}`; }
